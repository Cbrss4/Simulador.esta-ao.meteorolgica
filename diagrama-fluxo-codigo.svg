<svg width="760" height="700" viewBox="0 0 760 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do firmware da estação meteorológica simulada</title>
  <desc id="desc">O firmware inicializa a comunicação serial, os sensores e as entradas, realiza leituras, valida os valores ambientais, imprime no terminal e repete o processo a cada dois segundos.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 13px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="760" height="700" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" class="title">Fluxo do firmware da simulação</text>

  <rect x="285" y="60" width="190" height="50" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="380" y="91" text-anchor="middle" class="label">Início</text>

  <path d="M380 110 V138" class="arrow"/>
  <rect x="190" y="140" width="380" height="82" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="380" y="168" text-anchor="middle" class="label">setup()</text>
  <text x="380" y="191" text-anchor="middle" class="detail">Inicia Serial, DHT22, BMP180 e entradas</text>
  <text x="380" y="210" text-anchor="middle" class="detail">GPIO 34, GPIO 35 e GPIO 32</text>

  <path d="M380 222 V250" class="arrow"/>
  <rect x="220" y="252" width="320" height="65" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="380" y="280" text-anchor="middle" class="label">BMP180 disponível?</text>
  <text x="380" y="301" text-anchor="middle" class="detail">Se não, registra aviso e continua</text>

  <path d="M380 317 V345" class="arrow"/>
  <rect x="160" y="347" width="440" height="82" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="380" y="375" text-anchor="middle" class="label">Ler sensores e entradas</text>
  <text x="380" y="398" text-anchor="middle" class="detail">DHT22, BMP180, LDR, potenciômetro e chave</text>
  <text x="380" y="417" text-anchor="middle" class="detail">Temperatura, umidade, pressão, luz, ar e chuva</text>

  <path d="M380 429 V457" class="arrow"/>
  <rect x="190" y="459" width="380" height="65" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="380" y="487" text-anchor="middle" class="label">Validar leituras ambientais</text>
  <text x="380" y="508" text-anchor="middle" class="detail">Identifica valores ausentes ou fora da faixa</text>

  <path d="M380 524 V552" class="arrow"/>
  <rect x="210" y="554" width="340" height="58" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="380" y="579" text-anchor="middle" class="label">Imprimir no monitor serial</text>
  <text x="380" y="600" text-anchor="middle" class="detail">Exibe as seis leituras formatadas</text>

  <path d="M380 612 V640" class="arrow"/>
  <rect x="285" y="642" width="190" height="42" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="380" y="668" text-anchor="middle" class="label">Aguardar 2 segundos</text>

  <path d="M285 663 H115 V388 H157" class="arrow"/>
  <text x="98" y="525" text-anchor="middle" class="detail" transform="rotate(-90 98 525)">Repetir continuamente</text>
</svg>
