<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fluxo de execução do código main.cpp</title>
<desc>O setup inicializa o Serial e o BME280. O loop lê os sensores, imprime os valores e espera 2 segundos, repetindo indefinidamente.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>

<g>
<rect x="260" y="20" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Ligar o ESP32</text>
</g>
<line x1="340" y1="64" x2="340" y2="96" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="240" y="96" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">setup()</text>
<text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Inicia Serial e BME280</text>
</g>
<line x1="340" y1="152" x2="340" y2="184" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="440" y="96" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="530" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">BME280 falhou?</text>
<text x="530" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#791F1F">Trava e avisa erro</text>
</g>
<path d="M440 122 L420 122" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="240" y="184" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="202" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">loop()</text>
<text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Repete a cada 2 segundos</text>
</g>
<line x1="340" y1="240" x2="340" y2="272" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="240" y="272" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Lê os sensores</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">BME280, LDR, MQ-135, chuva</text>
</g>
<line x1="340" y1="328" x2="340" y2="360" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="240" y="360" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">Imprime no Serial</text>
<text x="340" y="396" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#27500A">Mostra as leituras formatadas</text>
</g>
<line x1="340" y1="416" x2="340" y2="448" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="260" y="448" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="470" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Espera 2s</text>
</g>

<path d="M420 470 L500 470 L500 300 L442 300" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="500" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">↻ repete o loop</text>
</svg>
