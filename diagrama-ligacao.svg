<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Diagrama de ligação dos componentes ao ESP32</title>
<desc>ESP32 conectado ao BME280 via I2C, ao LDR e MQ-135 via entradas analógicas, e ao sensor de chuva via entrada digital.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="480" fill="#ffffff"/>

<g>
<rect x="40" y="180" width="140" height="120" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="230" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ESP32</text>
<text x="110" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Microcontrolador</text>
</g>

<g>
<rect x="280" y="40" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="370" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">BME280</text>
<text x="370" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">I2C — SDA/SCL</text>
</g>

<g>
<rect x="280" y="130" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="370" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">LDR</text>
<text x="370" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Analógico — D34</text>
</g>

<g>
<rect x="280" y="220" width="180" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="370" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">MQ-135</text>
<text x="370" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Analógico — D35</text>
</g>

<g>
<rect x="280" y="310" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Sensor de chuva</text>
<text x="370" y="346" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Digital — D32</text>
</g>

<path d="M180 220 L230 220 L230 68 L278 68" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M180 235 L250 235 L250 158 L278 158" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M180 260 L250 260 L250 248 L278 248" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M180 280 L230 280 L230 338 L278 338" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="520" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Alimentação: 3V3 e GND em todos os componentes</text>
</svg>
